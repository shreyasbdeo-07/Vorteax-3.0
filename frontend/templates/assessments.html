<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VORTEXA | Skill Assessment</title><link rel="stylesheet" href="{{ url_for('static', filename='css/candidate_dashboard.css') }}"><style>.assessment-wrap{max-width:1000px;margin:35px auto;padding:24px}.assessment-item{padding:18px;margin:14px 0;border:1px solid #dbe2ea;border-radius:12px}.assessment-item label{display:block;margin:8px 0}.muted{color:#64748b}.result{padding:16px;border-radius:12px;background:#eefbf3;margin-top:18px}</style></head><body><main class="assessment-wrap"><a href="/candidate/dashboard">← Back to dashboard</a><h1>Skill Assessments</h1><p class="muted">Assess only the skills saved in your profile. Questions are selected by the server; correct answers are not sent to the browser. Each attempt has a 15-minute server-enforced limit.</p><section id="assessmentPicker"><h2>Your selected skills</h2><div id="assessmentList">Loading...</div></section><section id="testArea" hidden><h2 id="testTitle"></h2><p>Time remaining: <strong id="timer">15:00</strong></p><form id="testForm"><div id="questions"></div><button class="primary-btn" type="submit">Submit assessment</button></form></section><div id="result" class="result" hidden></div><script src="{{ url_for('static', filename='js/assessments.js') }}"></script></main></body></html>
